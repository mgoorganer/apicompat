[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mgoorganer-apicompat"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出工具的版本兼容上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mgoorganer" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mgoorganer.github.io"
Repository = "https://github.com/mgoorganer/apicompat"
Issues = "https://github.com/mgoorganer/apicompat/issues"

[project.scripts]
apicompat = "apicompat:main"

[tool.setuptools]
py-modules = ["apicompat"]
